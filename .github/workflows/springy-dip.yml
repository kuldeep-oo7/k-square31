name: springy-dip
# The forward paper test of the OWN "springy dip" rule (studies/springy-dip-forward-2026-10-04).
# Every weekday before the open: add yesterday's NSE bhavcopy to the data-nse-cm archive, then list
# today's signals and settle earlier trades from NSE's official open/close only, and commit
# docs/paper-rules/springy-dip.json (the TRACK tab shows it on the next desk build).
on:
  schedule:
    - cron: "15 2 * * 1-5"      # 07:45 IST; GitHub may start it late, which only delays the list
    # Backstops: GitHub's scheduler dropped the whole 6 Oct 2026 morning run (TRACK stayed on 1 Oct data).
    # A re-run with nothing new exits "no change". None lands in 09:13-09:40 IST (the freeze).
    - cron: "5 3 * * 1-5"       # 08:35 IST
    - cron: "35 5 * * 1-5"      # 11:05 IST
    - cron: "45 13 * * 1-5"     # 19:15 IST, after NSE posts the day's files
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: springy-dip
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Release data lives in the PRIVATE repo kuldeep-oo7/k2-data (16 Oct 2026, so this repo can be public).
      # Until repo variable K2_DATA_REPO is set (after the token is tested), both stay on this repo, so nothing breaks in between.
      GH_TOKEN: ${{ vars.K2_DATA_REPO && secrets.K2_DATA_TOKEN || github.token }}
      GH_REPO: ${{ vars.K2_DATA_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Restore and extend NSE's bhavcopy archive
        env:
          K2_CM_DIR: nse-data/cm
          K2_STOP_IST: "23:59"
        run: |
          gh release download data-nse-cm -p nse-cm.tar.gz && tar -xzf nse-cm.tar.gz && rm nse-cm.tar.gz
          before=$(ls nse-data/cm/*.json | wc -l)
          node scripts/nse-cm-bhavcopy.js 2020-09-01
          after=$(ls nse-data/cm/*.json | wc -l)
          echo "sessions: $before -> $after"
          if [ "$after" != "$before" ]; then tar -czf nse-cm.tar.gz nse-data && gh release upload data-nse-cm nse-cm.tar.gz --clobber; fi
      - name: Restore the paper tests' daily NSE files (release data-paper-inputs)
        run: |
          if gh release download data-paper-inputs -p paper-inputs.tar.gz; then tar -xzf paper-inputs.tar.gz && rm paper-inputs.tar.gz; else echo "no paper-inputs archive yet"; fi
      - name: NSE F&O futures files for the last 40 days (open interest)
        run: K2_CM_DIR=nse-data/cm K2_FO_DIR=nse-fo K2_FROM=$(date -u -d '-40 days' +%F) node scripts/nse-fo-history.js
      - name: NSE index closes and NIFTY option prices for the last 40 days
        run: |
          K2_CM_DIR=nse-data/cm K2_IDX_DIR=nse-idx K2_FROM=$(date -u -d '-40 days' +%F) node scripts/nse-index-close-history.js
          K2_CM_DIR=nse-data/cm K2_OUT_DIR=nse-extra K2_FROM=$(date -u -d '-40 days' +%F) node scripts/nse-options-delivery-history.js
      - name: Keep NSE's index history archive current (release data-nse-idx)
        continue-on-error: true
        run: |
          gh release view data-nse-idx >/dev/null 2>&1 || gh release create data-nse-idx --title "NSE index history (data)" --notes "Daily open/high/low/close of NIFTY 50, BANK, FIN SERVICES, MIDCAP SELECT, NEXT 50 from NSE's ind_close_all files. Built by springy-dip.yml." --latest=false
          gh release download data-nse-idx -p nse-idx.json -D idx-archive --clobber || true
          node scripts/nse-index-archive.js nse-idx idx-archive/nse-idx.json nse-idx.json
          gh release upload data-nse-idx nse-idx.json --clobber
      - name: Stock option prices (last 40 days) and NSE industries, for the cheap-vol and industry tests
        continue-on-error: true
        run: |
          K2_CM_DIR=nse-data/cm K2_SOPT_DIR=nse-sopt K2_FROM=$(date -u -d '-40 days' +%F) node scripts/nse-stock-options-history.js
          gh release download data-research -p research-misc.tar.gz --clobber && tar -xzf research-misc.tar.gz research/industry-2026-10-04/industries.json && cp research/industry-2026-10-04/industries.json industries.json
      - name: NSE's FII/DII cash figures (NSE keeps only the latest day, so every day is saved here)
        continue-on-error: true
        run: K2_FLOWS_DIR=nse-flows node scripts/nse-fii-dii.js
      - name: NSE data atlas -- every daily file the atlas lists, kept automatically (release data-nse-atlas)
        # studies/nse-data-atlas-2026-10-11/ATLAS.md. One tarball per month; each run re-fetches the last 12
        # days (NSE posts some files a day late) and re-uploads only this month and last. ".none" (404) is not
        # kept, so a day NSE had not posted yet is tried again. Never fatal.
        continue-on-error: true
        run: |
          gh release view data-nse-atlas >/dev/null 2>&1 || gh release create data-nse-atlas --title "NSE data atlas (raw daily files)" --notes "NSE's own daily files listed in studies/nse-data-atlas-2026-10-11/ATLAS.md, one tarball per month. Built by springy-dip.yml." --latest=false
          m=$(TZ=Asia/Kolkata date +%Y-%m); pm=$(TZ=Asia/Kolkata date -d "$(TZ=Asia/Kolkata date +%Y-%m-15) -1 month" +%Y-%m)
          mkdir -p nse-atlas
          for mm in $pm $m; do gh release download data-nse-atlas -p "atlas-$mm.tar.gz" --clobber 2>/dev/null && tar -xzf "atlas-$mm.tar.gz" && rm "atlas-$mm.tar.gz" || echo "no atlas-$mm yet"; done
          K2_ATLAS_DIR=nse-atlas K2_FROM=$(date -u -d '-12 days' +%F) node scripts/nse-atlas-download.js
          K2_ATLAS_DIR=nse-atlas K2_FROM=$pm node scripts/nse-pit-download.js || echo "insider filings: failed this run"
          for mm in $pm $m; do files=$(ls -d nse-atlas/*/$mm* 2>/dev/null | grep -v '\.none$' || true); [ -n "$files" ] && tar -czf "atlas-$mm.tar.gz" $files && gh release upload data-nse-atlas "atlas-$mm.tar.gz" --clobber && echo "atlas-$mm: $(echo "$files" | wc -l) files"; done
      - name: NSE SLB open positions for the borrowing-surge test (studies/forward-v4-2026-10-12)
        # From 1 Aug 2026, so every name has its 20-file average; files already restored are not fetched again.
        run: K2_ATLAS_DIR=nse-slb K2_FROM=2026-08-01 node scripts/nse-atlas-download.js slb_openpos
      - name: Keep the paper tests' daily NSE files (release data-paper-inputs)
        run: |
          # The tests count from 2026-10-05 and are replayed from there on every run, but the steps above
          # fetch only 40 days. Each folder must still reach back before 5 Oct; if one does not, stop here
          # (nothing is committed) rather than publish a record with its first trades missing.
          for d in nse-fo/fut nse-idx nse-extra/opt nse-sopt nse-slb/slb_openpos; do
            first=$(ls "$d" 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | head -1 | cut -c1-10)
            echo "$d: from ${first:-none}, $(ls "$d" 2>/dev/null | wc -l) files"
            if [ -z "$first" ] || [[ "$first" > "2026-10-01" ]]; then echo "::error::$d does not reach back before 2026-10-05 (first: ${first:-none})"; exit 1; fi
          done
          # Every session NSE's index file has must also have its equity bhavcopy: a real session lost
          # as a "holiday" would shift the industry reversal's every-5th-session schedule silently.
          for f in nse-idx/*.json; do d=$(basename "$f" .json); [ -f "nse-data/cm/$d.json" ] || { echo "::error::NSE held a session on $d but nse-data/cm has no file for it"; exit 1; }; done
          gh release view data-paper-inputs >/dev/null 2>&1 || gh release create data-paper-inputs --title "Paper-test inputs (NSE daily files)" --notes "NSE's own F&O, index and option files from late Aug 2026 on, read by the forward paper tests (docs/paper-rules). Built by springy-dip.yml." --latest=false
          # .none (NSE answered 404) is not kept: a day missing today is fetched again tomorrow, within 40 days
          mkdir -p nse-flows && tar --exclude='*.none' -czf paper-inputs.tar.gz nse-fo nse-idx nse-extra nse-sopt nse-flows nse-slb
          gh release upload data-paper-inputs paper-inputs.tar.gz --clobber
      - name: Signals and the running score
        run: |
          npm install --omit=dev --no-audit --no-fund
          K2_CM_DIR=nse-data/cm node scripts/springy-dip-forward.js | tee -a "$GITHUB_STEP_SUMMARY"
          K2_CM_DIR=nse-data/cm K2_FUT_DIR=nse-fo/fut node scripts/oi-flow-forward.js | tee -a "$GITHUB_STEP_SUMMARY"
          K2_CM_DIR=nse-data/cm K2_IDX_DIR=nse-idx K2_OPT_DIR=nse-extra/opt node scripts/forward-v2.js | tee -a "$GITHUB_STEP_SUMMARY"
          K2_CM_DIR=nse-data/cm K2_SOPT_DIR=nse-sopt K2_INDUSTRY=industries.json node scripts/forward-v3.js | tee -a "$GITHUB_STEP_SUMMARY"
          K2_CM_DIR=nse-data/cm K2_SLB_DIR=nse-slb/slb_openpos K2_FUT_DIR=nse-fo/fut node scripts/forward-v4.js | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the list
        run: |
          git config user.name "k2-desk-bot"
          git config user.email "k2-desk-bot@users.noreply.github.com"
          git add docs/paper-rules/springy-dip.json docs/paper-rules/oi-flow.json docs/paper-rules/forward-v2.json docs/paper-rules/forward-v3.json docs/paper-rules/forward-v4.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "paper rules: forward tests updated"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
