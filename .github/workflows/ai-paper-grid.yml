name: K2 AI paper grid

on:
  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30,45 4-9 * * 1-5"
    - cron: "0,15 10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: k2-ai-paper-grid
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Evaluate all paper grid shards
        env:
          K2_SECRET: ${{ secrets.K2_CRON_SECRET }}
        run: |
          test -n "$K2_SECRET"
          run_shard() {
            shard="$1"
            echo "Processing shard $shard"
            curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors --max-time 90 \
              -H "Authorization: Bearer $K2_SECRET" \
              "https://k-square31.vercel.app/api/ai-run?shard=$shard"
            echo
          }
          export K2_SECRET
          export -f run_shard
          seq 0 49 | xargs -n 1 -P 5 bash -c 'run_shard "$0"'
