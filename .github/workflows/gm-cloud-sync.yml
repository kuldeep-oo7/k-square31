name: K2 GM cloud portfolio sync

on:
  schedule:
    - cron: "0,30 * * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read GM without changing K2"
        required: false
        type: boolean
        default: false

concurrency:
  group: k2-gm-cloud-portfolio-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read GM and update only the Kamlesh K2 portfolio
        env:
          GM_USERNAME: ${{ secrets.GM_USERNAME }}
          GM_PASSWORD: ${{ secrets.GM_PASSWORD }}
          K2_GM_CLOUD_SYNC_SECRET: ${{ secrets.K2_GM_CLOUD_SYNC_SECRET }}
          GM_CLOUD_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/gm-cloud-sync.js
