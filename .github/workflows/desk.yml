# THE DESK, WITHOUT A SERVER.
#
# Everything that went wrong with hosting this came from one assumption: that a
# trading desk needs a machine running all day. It does not. The work measures
# one second; the fetching around it is a minute; and the output is a list of
# prices. A list of prices is a FILE.
#
# So this builds the file on a schedule, writes it to a Google Sheet, and
# commits it. There is no uptime to lose, no 512 MB ceiling, no fifteen-minute
# sleep, no monthly instance-hour cap, and no laptop that has to stay open in a
# dark house.
#
# ---------------------------------------------------------------------------
# WHAT THE BUDGET ACTUALLY IS, because getting this wrong is what suspended the
# last host. This repository is PRIVATE, and on GitHub Free a private repository
# gets 2,000 Linux minutes a month; when they are gone and there is no payment
# method on file, workflows are BLOCKED for the rest of the month. (Actions is
# free and unmetered only on PUBLIC repositories.)
#
# Measured on this machine: the option build itself is ONE SECOND. The cost is
# the Angel One instrument master, which took 78.8s to fetch, plus npm install.
# So the instrument master is cached for the trading day -- it only changes once
# a day -- which turns every run after the first into well under a minute.
#
# Budget with the outside clock: 21 dispatches a day at ~2 billed minutes, plus
# eight backstop gates at one minute each when they stand down, is near 50
# minutes a day and 1,050 a month against the 2,000 cap. The levels are FROZEN
# for the session anyway (see scripts/session-freeze.js), so a faster cadence
# would only refresh the "NOW" column.
#
# ONE TRAP, and it is why this commits on every run: GitHub disables a scheduled
# workflow after 60 days with no commit activity on the default branch, and the
# only warning is an email. Because each run commits the rebuilt page, the
# schedule keeps itself alive.
#
# NOT GITHUB PAGES. Asked for directly, the API answered: "Your current plan
# does not support GitHub Pages for this repository" (HTTP 422). Pages needs a
# public repository on GitHub Free, and this repository holds the strategy. The
# page is therefore committed to docs/ for the record, and the thing you
# actually READ on a phone is the Google Sheet.

name: Build the desk

on:
  # THE CLOCK IS NOT GITHUB'S. Measured on 2026-09-23, the first day this ran:
  # the schedule was set for every twenty minutes through the session, and
  # GitHub started NOTHING between 09:13 and 14:13 IST. It then fired runs at
  # 19:46, 20:14 and 20:35 IST that match no slot at all, hours after the close.
  # GitHub's own documentation allows exactly this -- "If the load is
  # sufficiently high enough, some queued jobs may be dropped" -- and
  # independent reports through 2026 describe delays growing past four hours.
  #
  # A trading desk cannot have a best-effort clock. The PRIMARY clock is
  # therefore outside GitHub: cron-job.org, free, scheduled directly in
  # Asia/Kolkata, calling the workflow_dispatch API. A dispatch starts a run
  # straight away instead of waiting in the queue behind everyone else's cron.
  # Setup: deploy/CLOCK.md.
  #
  # What is left below is a BACKSTOP for the day the outside clock fails:
  # hourly, off the hour. The gate job skips a scheduled run whenever a build
  # already landed in the last twelve minutes, so the two clocks cannot
  # double-bill a month that only has 2,000 minutes in it.
  schedule:
    - cron: "43 3 * * 1-5"       # 09:13 IST, pre-open
    # 09:16 IST, THE FIRST BUILD AFTER THE OPEN (the user, 28 Sep): the first
    # live page used to be the 09:33 build, landing at 09:37 -- until then the
    # page showed the last session's futures. The outside clock gets a 09:16
    # job too; this is its backstop, and the gate below lets it through.
    - cron: "46 3 * * 1-5"
    - cron: "13 4-9 * * 1-5"     # 09:43 to 14:43 IST, hourly
    - cron: "3 10 * * 1-5"       # 15:33 IST, after the close
    # THE EVENING, for the day's settlement prices. NSE's own server dates the
    # F&O settlement file (Last-Modified, read 2026-09-24): 22 Sep at 18:52 IST,
    # 23 Sep at 18:40, 24 Sep at 19:08. Every build between the 15:30 close and
    # then prices options on the PREVIOUS day's file -- on 24 Sep, a day the
    # Nifty fell 1.6%, that was the page all evening. These two are the page
    # for tonight and for planning tomorrow; the levels themselves are still
    # frozen from live books in the session.
    - cron: "13 14 * * 1-5"      # 19:43 IST
    - cron: "43 15 * * 1-5"      # 21:13 IST, the same again if the file was late
  workflow_dispatch:        # the outside clock, and a button for when you want it now

permissions:
  contents: write           # to commit the rebuilt page and the session ledger
  actions: write            # to start the paper-test job when GitHub's own schedule has not (see below)

concurrency:
  # A run must never overlap the previous one: two jobs committing the same
  # file is a merge conflict that silently stops the schedule. And two jobs
  # freezing the same session ledger is the moving-price bug all over again.
  group: desk-build
  cancel-in-progress: false

jobs:
  gate:
    # Only a scheduled run asks this question; a dispatch from the outside clock
    # skips it, and a skipped job is not billed. So the check costs a minute
    # only when the backstop fires -- which is the only time it is needed.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          last=$(gh api "repos/$REPO/commits?path=docs/data.json&sha=$BRANCH&per_page=1"                    --jq '.[0].commit.committer.date' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "no previous build found -- building"
            exit 0
          fi
          # The first build after the 09:15 open always runs: the 09:13
          # pre-open build lands at ~09:14, and standing down for it would keep
          # the last session's prices on the page for another twenty minutes.
          open=$(date -d "$(TZ=Asia/Kolkata date +%Y-%m-%d) 09:15 +0530" +%s)
          if [ "$(date -u +%s)" -ge "$open" ] && [ "$(date -u -d "$last" +%s)" -lt "$open" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "first build after the open -- building"
            exit 0
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          if [ "$age" -lt 720 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "backstop standing down: the last build landed $((age / 60)) min ago, so the outside clock is working"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "backstop building: the last build is $((age / 60)) min old, so the outside clock has gone quiet"
          fi

  build:
    needs: gate
    # Build when the gate was skipped (a dispatch), when it said go, or when it
    # FAILED -- a broken check must never be the reason the desk went dark.
    if: ${{ !cancelled() && (needs.gate.result != 'success' || needs.gate.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10     # a hung fetch must not eat the month's budget

    env:
      TZ: Asia/Kolkata
      # Read straight from the environment by api/_lib/google-store.js. Note the
      # exact spelling -- these names are checked by googleStoreConfigured() and
      # a near-miss disables the Sheet silently, with a green build.
      K2_GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.K2_GOOGLE_SHEETS_WEB_APP_URL }}
      K2_GOOGLE_SHEETS_ARCHIVE_SECRET: ${{ secrets.K2_GOOGLE_SHEETS_ARCHIVE_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # THE INSTALLED PACKAGES THEMSELVES, keyed on the lockfile (16 Oct 2026). setup-node's npm cache restored
      # ~215 MB of tarballs (~10 s) and npm install then took ~11 s on every build; a hit here skips both.
      - id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: desk-node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'package.json') }}

      - name: Today's date in India
        # Every cache key and every session boundary in this desk is an IST
        # date. The runner is UTC, and between 00:00 and 05:30 UTC the two
        # disagree -- which is exactly the window the pre-open build runs in.
        #
        # IST_HALF splits the day at the 15:30 close, so the evening build that
        # fetches the day's price history can keep it: a cache can never be
        # changed once written, and one key per day meant the only history kept
        # was the morning's.
        run: |
          echo "IST_DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)" >> "$GITHUB_ENV"
          if [ "$(TZ=Asia/Kolkata date +%H%M)" -ge 1530 ]; then echo "IST_HALF=pm" >> "$GITHUB_ENV"; else echo "IST_HALF=am" >> "$GITHUB_ENV"; fi

      - name: Start today's paper-test job if GitHub's scheduler has not
        # GitHub's own 07:45 schedule started springy-dip.yml 6-6.5 hours late on every trading day of
        # 5-9 Oct 2026 (14:07-14:32 IST), so TRACK showed the morning's paper signals in the afternoon.
        # This build is started on time by cron-job.org: on a weekday after 07:00 IST, if no paper run
        # has started today, start one. A workflow_dispatch from GITHUB_TOKEN always creates a run
        # (GitHub docs, "Triggering a workflow"). Never fatal.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(TZ=Asia/Kolkata date +%u)" -le 5 ] && [ "$(TZ=Asia/Kolkata date +%H%M)" -ge 0700 ] || { echo "not a weekday morning"; exit 0; }
          since=$(date -u -d "$(TZ=Asia/Kolkata date +%F) 00:00 +0530" +%FT%TZ)
          n=$(gh run list -R "${{ github.repository }}" -w springy-dip.yml -L 30 --json createdAt -q "[.[] | select(.createdAt >= \"$since\")] | length")
          if [ "$n" = "0" ]; then gh workflow run springy-dip.yml -R "${{ github.repository }}" --ref main && echo "started springy-dip (no run since $since)"; else echo "springy-dip already started today ($n run(s) since $since)"; fi
      - name: Restore today's exchange data
        # The instrument master is 4.7 MB and takes 78.8s to fetch; it changes
        # once a day. Keying on the IST date and half means the first run of
        # each half pays for it and every run after that gets it free: two
        # ~23 MB entries a trading day, evicted by GitHub after a week unused.
        #
        # RESTORE and SAVE are separate steps now, for one reason in GitHub's
        # own words: the combined action saves "if the job completes
        # successfully" -- and the health gate at the end exists to fail jobs.
        # A red run must not also throw away the history it just fetched.
        id: desk-cache
        uses: actions/cache/restore@v4
        with:
          path: .private/cache
          # ONE ENTRY PER RUN (6 Oct 2026). With one key per half-day only the FIRST build's cache was
          # kept: every later build re-fetched the same part of the ~290 risk histories inside its
          # 2-minute budget and then lost it, so most of them never got past 1 Oct and the bad-day risk
          # replay stayed four sessions old. Now each build restores the newest entry and saves its own,
          # so the refresh adds up. Entries are ~23 MB; GitHub evicts unused ones after 7 days.
          key: k2-desk-cache-${{ env.IST_DATE }}-${{ env.IST_HALF }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            k2-desk-cache-${{ env.IST_DATE }}-${{ env.IST_HALF }}-
            k2-desk-cache-

      - name: Install
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm install --omit=dev --no-audit --no-fund

      - name: Broker credentials
        # ONE secret holding .private/brokers.json verbatim, because that is the
        # file api/_lib/broker-auth.js actually reads. The four-separate-
        # variables version of this step was wrong in a way that would never
        # have shown up as an error: the code looks for ANGELONE_MPIN, not
        # ANGEL_ONE_PASSWORD, so every quote would have quietly fallen back to
        # the settlement file while the build stayed green.
        #
        # With no secret set the desk still builds, from the exchange settlement
        # file alone, and the page says so rather than implying the prices are
        # executable.
        env:
          K2_BROKERS_JSON: ${{ secrets.K2_BROKERS_JSON }}
        run: |
          mkdir -p .private/cache
          if [ -n "$K2_BROKERS_JSON" ]; then
            printf '%s' "$K2_BROKERS_JSON" > .private/brokers.json
            chmod 600 .private/brokers.json
            node -e 'JSON.parse(require("fs").readFileSync(".private/brokers.json","utf8"))' \
              && echo "broker credentials present and parse as JSON"
          else
            echo "no broker credentials configured; prices will come from the settlement file"
          fi

      - name: NSE's own index history (FINNIFTY and MIDCPNIFTY have none on Yahoo)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ vars.K2_DATA_REPO && secrets.K2_DATA_TOKEN || github.token }}
          GH_REPO: ${{ vars.K2_DATA_REPO || github.repository }}
        run: mkdir -p nse-idx && gh release download data-nse-idx -p nse-idx.json -D nse-idx --clobber && ls -l nse-idx

      - name: Fetch the exchange contract file, the instrument master and today's bars
        # A brand-new runner has none of this. Every step inside is non-fatal:
        # a snapshot that admits what it is beats a blank page, and beats a
        # confident page built on nothing.
        continue-on-error: true
        run: node scripts/prepare-static-build.js

      - name: Record the order books (private release orderflow-rec)
        # The build saved this session's order books (best 5 bids/asks, totals, OI) to orderflow/<date>.jsonl;
        # append them to that day's file on the PRIVATE release, so an order-flow history builds up.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ vars.K2_DATA_REPO && secrets.K2_DATA_TOKEN || github.token }}
          GH_REPO: ${{ vars.K2_DATA_REPO || github.repository }}
        run: |
          shopt -s nullglob
          files=(orderflow/*.jsonl)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing recorded on this build"; exit 0; fi
          gh release view orderflow-rec >/dev/null 2>&1 || gh release create orderflow-rec --title "Order-flow recordings (data)" --notes "Order books (best 5 bids/asks, totals, OI) from Angel One FULL quotes, one line per in-session desk build. api/_lib/orderflow-recorder.js. Private data, not a release of the desk." --latest=false
          for f in "${files[@]}"; do
            day=$(basename "$f" .jsonl); asset="of-$day.jsonl.gz"
            rm -f "$asset"; gh release download orderflow-rec -p "$asset" --clobber 2>/dev/null || true
            { [ -f "$asset" ] && gunzip -c "$asset"; cat "$f"; } | gzip -c > "$asset.new" && mv "$asset.new" "$asset"
            gh release upload orderflow-rec "$asset" --clobber && echo "$asset: $(gunzip -c "$asset" | wc -l) builds recorded"
          done

      - name: Build the page and freeze the day's levels
        run: node scripts/publish-static-desk.js

      - name: Put the prices on the run page
        # The one view that needs nothing from anybody: no Pages plan, no Apps
        # Script re-deploy, no second account. GitHub renders this as markdown on
        # the run page, and the GitHub mobile app opens it from anywhere.
        continue-on-error: true
        run: node scripts/write-run-summary.js

      # THE PUBLIC PAGE FIRST. The Sheet step below can take minutes (the
      # Apps Script scans all of K2_STATE on every write); it must never hold
      # the page back -- least of all on the 09:16 build that freezes the day.
      - name: Mirror the page to the public URL
        # GitHub Pages cannot serve THIS repository -- asked directly, the API
        # said "Your current plan does not support GitHub Pages for this
        # repository" (422), because Pages needs a public repo on GitHub Free
        # and this one holds the strategy.
        #
        # So only the BUILT PAGE goes to a second, public repository, which
        # Pages will serve. index.html is self-contained: no code, no data
        # files, no ledger, no commit history from here. If the deploy key is
        # not configured this step says so and changes nothing.
        continue-on-error: true
        timeout-minutes: 2
        env:
          MIRROR_KEY: ${{ secrets.K2_MIRROR_DEPLOY_KEY }}
          MIRROR_REPO: ${{ vars.K2_MIRROR_REPO }}
        run: |
          if [ -z "$MIRROR_KEY" ]; then
            echo "no mirror deploy key configured; the page was not published to a public URL"
            exit 0
          fi
          REPO="${MIRROR_REPO:-kuldeep-oo7/k2-desk}"
          mkdir -p ~/.ssh
          printf '%s\n' "$MIRROR_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          rm -rf /tmp/k2mirror
          git clone --depth 1 "git@github.com:${REPO}.git" /tmp/k2mirror
          cp docs/index.html /tmp/k2mirror/index.html
          # The open page polls this to load the next build by itself.
          if [ -f docs/version.json ]; then cp docs/version.json /tmp/k2mirror/version.json; fi
          : > /tmp/k2mirror/.nojekyll
          cd /tmp/k2mirror
          git config user.name "k2-desk-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "public page unchanged"
          else
            git commit -q -m "desk: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git push -q && echo "published to https://$(echo "$REPO" | cut -d/ -f1).github.io/$(echo "$REPO" | cut -d/ -f2)/"
          fi

      - name: Publish to the Google Sheet
        # The Sheet is the part that is readable from a phone in an office on
        # the other side of the world, and the part that cannot be suspended.
        # It must never be able to fail the build that produced the prices --
        # nor to stall it: 75 s of a 133 s build on 25 Sep, and Monday's first
        # freeze appends ~220 rows at once. A step over its limit is killed and,
        # with continue-on-error, the job goes on to publish the page (GitHub
        # docs, steps[*].timeout-minutes / continue-on-error).
        continue-on-error: true
        timeout-minutes: 4
        run: node scripts/publish-to-sheet.js

      - name: Commit it
        run: |
          git config user.name "k2-desk-bot"
          git config user.email "noreply@users.noreply.github.com"
          # NO REBASE AT ALL, because there is nothing here worth merging.
          #
          # Rebasing AFTER committing replayed this run's docs/levels.json onto
          # whatever landed mid-build, with the failure swallowed by || true --
          # and the session ledger is the one file where a swallowed conflict is
          # unrecoverable, because a mangled ledger is a mangled set of buy
          # limits for the rest of the day. Rebasing BEFORE committing then
          # failed outright on its first run: npm install had touched
          # package-lock.json, so the tree was not clean and git refused.
          #
          # Both attempts were solving a problem this job does not have. The
          # working tree already holds the freshly built docs/, and the remote
          # tip is authoritative for everything else. Moving HEAD AND THE INDEX
          # to the remote tip without touching the working tree, then staging
          # only docs/, produces a clean commit on top of whatever landed --
          # with no merge, no conflict and nothing to swallow. Files outside
          # docs/ are left unstaged and die with the runner.
          #
          # --mixed, NEVER --soft. --soft moves HEAD but keeps this run's index,
          # which is the CODE AS IT WAS CHECKED OUT; a fix pushed while this run
          # was building would have been silently reverted by this commit, and
          # every build after it would have run the old code. (Found in the
          # 2026-09-24 audit; no commit had hit it yet.)
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          git reset --mixed --quiet "origin/${GITHUB_REF_NAME}"
          # docs/paper-rules is written ONLY by springy-dip.yml. The reset above keeps this build's
          # older copy in the working tree, and "git add docs/" then committed it back: on 9 Oct 2026
          # the 14:35 build undid the paper job's 14:33 update (data through 8 Oct -> 7 Oct). Take main's.
          git checkout "origin/${GITHUB_REF_NAME}" -- docs/paper-rules 2>/dev/null || true
          git add docs/
          if git diff --cached --quiet; then
            echo "nothing changed this run"
          else
            git commit -m "desk: rebuilt $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            # One retry: a push can still lose a race with a laptop. A second
            # failure is left LOUD rather than swallowed -- the next run rebuilds
            # from the remote tip anyway, so a lost push costs one snapshot.
            git push || { git fetch --quiet origin "${GITHUB_REF_NAME}"; git reset --mixed --quiet "origin/${GITHUB_REF_NAME}"; git checkout "origin/${GITHUB_REF_NAME}" -- docs/paper-rules 2>/dev/null || true; git add docs/; git commit -m "desk: rebuilt $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"; git push; }
          fi

      - name: Photograph the first in-session page (page-check), once a morning
        # The laptop's Modern Standby missed the 09:20 check on 21 and 22 Oct 2026. This build is started on time by
        # cron-job.org: between 09:30 and 10:00 IST on a weekday, if no page-check has started since 09:00, start one for
        # this build's stamp (it waits until that build is served). Photos and the NSE audit land on the release
        # page-check, readable later. Never fatal.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M)
          [ "$(TZ=Asia/Kolkata date +%u)" -le 5 ] && [ "$now" -ge 0930 ] && [ "$now" -lt 1000 ] || { echo "not the morning check window ($now IST)"; exit 0; }
          since=$(date -u -d "$(TZ=Asia/Kolkata date +%F) 09:00 +0530" +%FT%TZ)
          n=$(gh run list -R "${{ github.repository }}" -w page-check.yml -L 20 --json createdAt -q "[.[] | select(.createdAt >= \"$since\")] | length")
          [ "$n" = "0" ] || { echo "page-check already started this morning ($n run(s))"; exit 0; }
          stamp=$(node -e 'console.log(String(require("./docs/version.json").builtAtIst || "").replace(" IST", ""))')
          gh workflow run page-check.yml -R "${{ github.repository }}" --ref main -f expect="$stamp" -f label=morning-auto && echo "started page-check for $stamp"

      - name: Keep this build's exchange data and price histories for the next build
        # Every run saves under its own key (see the restore step), so what this build
        # fetched is never thrown away. Before the gate, so a red run still keeps it;
        # never fatal, because losing a cache costs one slow build.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .private/cache
          key: ${{ steps.desk-cache.outputs.cache-primary-key }}

      - name: Health gate -- fail loudly, never quietly
        # LAST, and after the commit, so an unhealthy run has still saved its
        # ledger; and with no continue-on-error, because this is the one step
        # whose whole job is to turn the run red. Every failure it looks for
        # used to produce a green run: a broker login that failed, a session
        # that priced nothing live or never froze, a ledger that disagrees with
        # itself. See scripts/check-desk-health.js.
        run: node scripts/check-desk-health.js
