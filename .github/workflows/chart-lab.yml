name: chart-lab
# The chart lab (studies/chart-lab-2026-10-29 on branch claude/ta-champions-2026-10-29): our own chart, pattern and candle
# strategies, both directions, priced on the near-month future, registered before any real-data run. Started by a push of
# studies/chart-lab-2026-10-29/RUN.txt to that branch (no change to main). Summary rows only: this repository is public.
on:
  push:
    branches: [claude/ta-champions-2026-10-29]
    paths: [studies/chart-lab-2026-10-29/RUN.txt]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: NSE data from the private repo
        env:
          GH_TOKEN: ${{ secrets.K2_DATA_TOKEN }}
          GH_REPO: kuldeep-oo7/k2-data
        run: |
          mkdir -p "$RUNNER_TEMP/d" && cd "$RUNNER_TEMP/d"
          for p in 2005-01-01 2009-01-01 2013-01-01 2017-01-01; do
            gh release download data-oos -p "nse-old-$p.tar.gz" --clobber
            tar -xzf "nse-old-$p.tar.gz" --exclude='nse-old/opt' --exclude='nse-old/sopt' && rm "nse-old-$p.tar.gz"
          done
          gh release download data-nse-cm -p nse-cm.tar.gz --clobber && tar -xzf nse-cm.tar.gz && rm nse-cm.tar.gz
          mkdir -p research/rising-stocks-2026-10-02 && mv nse-data research/rising-stocks-2026-10-02/nse-data
          gh release download data-research -p research-nse-fo.tar.gz --clobber && tar -xzf research-nse-fo.tar.gz && rm research-nse-fo.tar.gz
          gh release download data-macro -p macro-ind_close_all.tar.gz --clobber && tar -xzf macro-ind_close_all.tar.gz && rm macro-ind_close_all.tar.gz
          echo "2005-2020: cm $(ls nse-old/cm | grep -c json), fut $(ls nse-old/fut | grep -c json), idx $(ls nse-old/idx | grep -c json); 2020-2026: cm $(ls research/rising-stocks-2026-10-02/nse-data/cm | grep -c json), fut $(ls research/orderflow-2026-10-03/nse-fo/fut | grep -c json); index closes $(ls macro/ind_close_all | wc -l)"
      - name: The chart lab (checks, then the one real run)
        env:
          K2_OOS_NSE: ${{ runner.temp }}/d/nse-old
          K2_RESEARCH_DIR: ${{ runner.temp }}/d/research
          K2_MACRO_IC: ${{ runner.temp }}/d/macro/ind_close_all
        run: |
          set -o pipefail
          cd studies/chart-lab-2026-10-29
          node --max-old-space-size=12000 run.js --real | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-lab-result
          if-no-files-found: ignore
          path: |
            studies/chart-lab-2026-10-29/RESULT.txt
            studies/chart-lab-2026-10-29/result.json
