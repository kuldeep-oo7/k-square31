name: K2 portal

# Builds and publishes the desk portal using independent public market data.
# Zero broker dependencies, zero automated logins, 100% cloud-safe.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many names to measure (500 covers the Nifty 500)"
        required: false
        default: "500"
      force_universe:
        description: "Re-measure the universe even if this week's plan exists"
        required: false
        type: boolean
        default: false
  schedule:
    # Run once a day before NSE market opens (03:30 UTC = 09:00 AM IST)
    - cron: "30 3 * * 1-5"

concurrency:
  group: k2-portal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Open the site repository
        env:
          DEPLOY_KEY: ${{ secrets.K2_PORTAL_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:kuldeep-oo7/k2-portal.git publish

      - name: Decide whether the universe needs re-measuring
        id: plan
        run: |
          if [ -f publish/plan.json ] && [ "${{ inputs.force_universe }}" != "true" ]; then
            cp publish/plan.json plan-full.json
            if node scripts/plan-is-current.js plan-full.json; then
              echo "measure=false" >> "$GITHUB_OUTPUT"
            else
              echo "measure=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Measure the universe
        if: ${{ steps.plan.outputs.measure == 'true' }}
        env:
          K2_UPSIDE_MODEL: models/upside.json
        run: node scripts/weekly-plan.js --top 60 --out plan-full.json

      - name: Build the portal
        run: node scripts/build-portal.js site

      - name: Refuse to publish a leaking build
        run: node scripts/verify-portal.js site/index.html

      - name: Publish
        run: |
          cp site/index.html publish/index.html
          if [ -f plan-full.json ]; then
            cp plan-full.json publish/plan.json
          fi
          touch publish/.nojekyll
          cd publish
          git config user.name "K2 portal publisher"
          git config user.email "noreply@users.noreply.github.com"
          git add index.html plan.json .nojekyll
          git diff --staged --quiet || git commit -m "Publish K2 portal with public market data"
          git push origin main


