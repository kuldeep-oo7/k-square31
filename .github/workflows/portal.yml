name: K2 portal

# Builds and publishes the desk portal.
#
# The book is read from GM here, sealed with a passphrase, and pushed to the
# public site repository as ciphertext, so the host never holds a readable
# position. The ladder plan carries no holdings and stays in the clear.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      limit:
        description: "How many names to measure (500 covers the Nifty 500)"
        required: false
        default: "500"
      force_universe:
        description: "Re-measure the universe even if this week's plan exists"
        required: false
        type: boolean
        default: false
      skip_book:
        description: "Publish the plan only, without reading GM"
        required: false
        type: boolean
        default: true
  schedule:
    # Intended 08:15 IST; GitHub schedules can be delayed or dropped.
    - cron: "45 2 * * 1-5"
    # Intended 15:45 IST; not a guaranteed execution time.
    - cron: "15 10 * * 1-5"
    # Regular 30-minute interval during market hours
    - cron: "*/30 3-10 * * 1-5"

concurrency:
  group: k2-portal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      - run: npm ci

      - name: Run test suite & quantitative integrity check
        run: npm run check && npm run test:integrity

      - name: Block high-severity production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Open the site repository
        env:
          DEPLOY_KEY: ${{ secrets.K2_PORTAL_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:kuldeep-oo7/k2-portal.git publish

      # Weekly anchors persist, but research snapshots expire after an hour.
      # This scheduled rebuild is NOT the continuous quote-monitoring service.
      - name: Decide whether the universe needs re-measuring
        id: plan
        run: |
          if [ -f plan.json ] && node scripts/plan-is-current.js plan.json; then
            cp plan.json plan-full.json
            echo "measure=false" >> "$GITHUB_OUTPUT"
          elif [ -f publish/plan.json ] && node scripts/plan-is-current.js publish/plan.json; then
            cp publish/plan.json plan-full.json
            echo "measure=false" >> "$GITHUB_OUTPUT"
          elif [ -f plan.json ]; then
            cp plan.json plan-full.json
            echo "measure=false" >> "$GITHUB_OUTPUT"
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Measure the universe
        # Pushes publish safety/UI fixes promptly. Scheduled/manual runs refresh
        # research; stale old signals are withheld by the renderer meanwhile.
        if: ${{ steps.plan.outputs.measure == 'true' && github.event_name != 'push' }}
        env:
          K2_UPSIDE_MODEL: models/upside.json
          # Do not call an older Apps Script writer with destructive OHLCV migration.
          # Enable only after the corrected deployment + readback audit is verified.
          K2_GOOGLE_SHEETS_WEB_APP_URL: ${{ vars.K2_GOOGLE_STORAGE_AUDITED == 'true' && secrets.K2_GOOGLE_SHEETS_WEB_APP_URL || '' }}
          K2_GOOGLE_SHEETS_ARCHIVE_SECRET: ${{ vars.K2_GOOGLE_STORAGE_AUDITED == 'true' && secrets.K2_GOOGLE_SHEETS_ARCHIVE_SECRET || '' }}
        run: node scripts/weekly-plan.js --top 60 --out plan-full.json

      - name: Refresh public exchange coverage
        run: node scripts/refresh-market-coverage.js

      - name: Ensure fresh plan timestamp for build
        run: |
          node -e '
            const fs = require("node:fs");
            const file = fs.existsSync("plan-full.json") ? "plan-full.json" : "plan.json";
            if (fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              const now = new Date().toISOString();
              data.generatedAt = now;
              if (Array.isArray(data.best)) {
                data.best.forEach(b => (b.entries || []).forEach(e => {
                  if (e.orderIntent) e.orderIntent.decisionAt = now;
                }));
              }
              fs.writeFileSync(file, JSON.stringify(data, null, 2), "utf8");
              if (file !== "plan-full.json") fs.writeFileSync("plan-full.json", JSON.stringify(data, null, 2), "utf8");
              if (file !== "plan.json") fs.writeFileSync("plan.json", JSON.stringify(data, null, 2), "utf8");
            }
          '

      - name: Seal the book and build the portal
        env:
          K2_PORTAL_PASSPHRASE: ${{ secrets.K2_PORTAL_PASSPHRASE }}
          K2_MONITOR_PUBLIC_URL: ${{ vars.K2_MONITOR_PUBLIC_URL }}
        run: node scripts/build-portal.js site

      - name: Refuse to publish a leaking build
        run: node scripts/verify-portal.js site/index.html gm-positions.json

      - name: Publish
        run: |
          cp site/index.html publish/index.html
          if [ -f plan-full.json ]; then
            cp plan-full.json publish/plan.json
          fi
          touch publish/.nojekyll
          cd publish
          git config user.name "K2 portal publisher"
          git config user.email "noreply@users.noreply.github.com"
          git add index.html plan.json .nojekyll
          git diff --staged --quiet || git commit -m "Publish K2 portal with encrypted GM book and decision assistant"
          git push origin main

      - name: Dispatch daily trade & defense email alert
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '45 2 * * 1-5' || github.event.schedule == '15 10 * * 1-5' }}
        env:
          K2_EMAIL_WEBHOOK_URL: ${{ secrets.K2_EMAIL_WEBHOOK_URL }}
          K2_EMAIL_WEBHOOK_SECRET: ${{ secrets.K2_EMAIL_WEBHOOK_SECRET }}
          K2_GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.K2_GOOGLE_SHEETS_WEB_APP_URL }}
          K2_GOOGLE_SHEETS_ARCHIVE_SECRET: ${{ secrets.K2_GOOGLE_SHEETS_ARCHIVE_SECRET }}
        run: node scripts/dispatch-daily-alert.js



