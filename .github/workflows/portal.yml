name: K2 portal

# Builds and publishes the desk portal.
#
# The book is read from GM here, sealed with a passphrase, and pushed to the
# public site repository as ciphertext, so the host never holds a readable
# position. The ladder plan carries no holdings and stays in the clear.
#
# Pages is not available on a private repository on this plan, so the built page
# is pushed to kuldeep-oo7/k2-portal over SSH with a deploy key. The engine stays
# private; only the page travels.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many names to measure (500 covers the Nifty 500)"
        required: false
        default: "500"
      force_universe:
        description: "Re-measure the universe even if this week's plan exists"
        required: false
        type: boolean
        default: false
      skip_book:
        description: "Publish the plan only, without reading GM"
        required: false
        type: boolean
        default: false
  schedule:
    # Every 30 minutes through the NSE session (09:15-15:30 IST is 03:45-10:00
    # UTC). The book is re-read every time; the universe is not.
    - cron: "*/30 3-10 * * 1-5"

concurrency:
  group: k2-portal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Open the site repository
        env:
          DEPLOY_KEY: ${{ secrets.K2_PORTAL_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:kuldeep-oo7/k2-portal.git publish

      # The universe measurement takes about twenty minutes and only changes when
      # the week's anchor changes, so the published plan is carried forward and
      # re-measured once a week. Without this, a half-hourly refresh would spend
      # its whole window rescanning five hundred names.
      - name: Decide whether the universe needs re-measuring
        id: plan
        run: |
          if [ -f publish/plan.json ] && [ "${{ inputs.force_universe }}" != "true" ]; then
            cp publish/plan.json plan-full.json
            if node scripts/plan-is-current.js plan-full.json; then
              echo "measure=false" >> "$GITHUB_OUTPUT"
            else
              echo "measure=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "measure=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install a browser for the GM read
        if: ${{ !inputs.skip_book }}
        run: npx playwright install --with-deps chromium

      - name: Read the GM book
        if: ${{ !inputs.skip_book }}
        env:
          GM_USERNAME: ${{ secrets.GM_USERNAME }}
          GM_PASSWORD: ${{ secrets.GM_PASSWORD }}
        run: node scripts/gm-portfolio-dump.js gm-positions.json

      - name: Measure the held names
        if: ${{ !inputs.skip_book }}
        run: node scripts/weekly-plan.js --symbols "$(node scripts/held-symbols.js gm-positions.json)" --top 60 --out plan-holdings.json

      - name: Measure the universe
        if: ${{ steps.plan.outputs.measure == 'true' }}
        run: node scripts/weekly-plan.js --limit "${{ inputs.limit || 500 }}" --top 60 --out plan-full.json

      - name: Seal the book and build the portal
        env:
          K2_PORTAL_PASSPHRASE: ${{ secrets.K2_PORTAL_PASSPHRASE }}
        run: node scripts/build-portal.js site

      - name: Refuse to publish a leaking build
        run: node scripts/verify-portal.js site/index.html gm-positions.json

      - name: Publish
        run: |
          cp site/index.html publish/index.html
          cp plan-full.json publish/plan.json
          touch publish/.nojekyll
          cd publish
          git config user.name "K2 portal publisher"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          # An unchanged page is a normal outcome outside market hours.
          git diff --staged --quiet && echo "Nothing changed." && exit 0
          git commit -m "Refresh the desk: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
