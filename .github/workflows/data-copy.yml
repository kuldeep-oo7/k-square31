name: data-copy
# One-off move (16-18 Oct 2026): copy every data release of this repo to the PRIVATE repo kuldeep-oo7/k2-data, so this
# repo can be made public. A file already there at the same size is skipped; a different size is replaced. Dispatch only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SRC: ${{ github.repository }}
      DST: kuldeep-oo7/k2-data
    steps:
      - name: Copy, release by release
        env:
          SRC_TOKEN: ${{ github.token }}
          DST_TOKEN: ${{ secrets.K2_DATA_TOKEN }}
        run: |
          bad=0
          for t in data-nse-all-2026 data-nse-atlas data-oos orderflow-rec data-paper-inputs data-research data-nse-idx data-nse-cm; do
            GH_TOKEN=$DST_TOKEN gh release view "$t" -R $DST >/dev/null 2>&1 || GH_TOKEN=$DST_TOKEN gh release create "$t" -R $DST --title "$t" --notes "Copied from $SRC" --latest=false >/dev/null
            GH_TOKEN=$SRC_TOKEN gh release view "$t" -R $SRC --json assets --jq '.assets[] | "\(.name) \(.size)"' > src.txt
            GH_TOKEN=$DST_TOKEN gh release view "$t" -R $DST --json assets --jq '.assets[] | "\(.name) \(.size)"' > dst.txt
            while read -r n s; do
              if grep -qx "$n $s" dst.txt; then continue; fi
              rm -rf w && mkdir w
              GH_TOKEN=$SRC_TOKEN gh release download "$t" -R $SRC -p "$n" -D w
              for i in 1 2 3; do GH_TOKEN=$DST_TOKEN gh release upload "$t" -R $DST "w/$n" --clobber && break; sleep 10; done
              got=$(GH_TOKEN=$DST_TOKEN gh release view "$t" -R $DST --json assets --jq ".assets[] | select(.name==\"$n\") | .size")
              have=$(stat -c %s "w/$n")
              if [ "$got" = "$have" ]; then echo "OK $t/$n $have"; else echo "::error::MISMATCH $t/$n local $have dst $got"; bad=1; fi
            done < src.txt
          done
          echo "--- final comparison (name size), source vs private:"
          for t in data-nse-all-2026 data-nse-atlas data-oos orderflow-rec data-paper-inputs data-research data-nse-idx data-nse-cm; do
            a=$(GH_TOKEN=$SRC_TOKEN gh release view "$t" -R $SRC --json assets --jq '.assets | length'); b=$(GH_TOKEN=$DST_TOKEN gh release view "$t" -R $DST --json assets --jq '.assets | length')
            echo "$t: $a files here, $b in k2-data"
          done
          exit $bad
