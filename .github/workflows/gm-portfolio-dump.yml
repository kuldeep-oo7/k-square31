name: K2 GM portfolio read-only dump

# Reads the GM book and uploads it as a short-lived build artifact. For use when
# the operational store is unavailable and the portfolio still needs to be seen.
# Nothing is written back to GM and nothing is published to the web app.

on:
  workflow_dispatch:

concurrency:
  group: k2-gm-portfolio-dump
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read the GM portfolio
        env:
          GM_USERNAME: ${{ secrets.GM_USERNAME }}
          GM_PASSWORD: ${{ secrets.GM_PASSWORD }}
        run: node scripts/gm-portfolio-dump.js gm-positions.json
      - uses: actions/upload-artifact@v4
        with:
          name: gm-positions
          path: gm-positions.json
          retention-days: 1
